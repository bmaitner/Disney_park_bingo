name: Publish app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # A new cache name per commit makes installed copies pick up the update.
      - name: Stamp service worker cache version
        run: sed -i "s/^const CACHE = \".*\";/const CACHE = \"parkbingo-${GITHUB_SHA::7}\";/" app/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deployment
        uses: actions/deploy-pages@v4
