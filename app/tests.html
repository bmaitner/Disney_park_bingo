<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Park bingo app tests</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; }
    .pass { color: #1b7f3b; }
    .fail { color: #B3261E; font-weight: 600; }
    li { margin: 2px 0; }
  </style>
</head>
<body>
  <h1>App tests</h1>
  <p id="summary">Running...</p>
  <ul id="results"></ul>

  <script type="module">
    import {
      filterSquares, makeCard, makeRng, completedLines, winningLines, cardAudience,
    } from "./bingo.js";
    import { buildSuggestion, validateSuggestion } from "./suggest.js";
    import { flushOutbox, sendCount, deviceId } from "./outbox.js";
    import { buildResult, summarizeCard } from "./results.js";
    import { readPrintSettings, printQuery, makePrintCards } from "./printing.js";

    const results = [];
    const check = (name, ok, detail = "") => results.push({ name, ok: Boolean(ok), detail });

    const data = await (await fetch("squares.json")).json();
    const expected = await (await fetch("tests/expected.json")).json();
    const { squares, parks } = data;

    // Filtering and subtitles match the R package for every combination.
    const poolMismatches = expected.filter(
      (e) => filterSquares(squares, e).length !== e.n
    );
    check(`pool sizes match R for ${expected.length} setting combinations`,
          poolMismatches.length === 0,
          poolMismatches.slice(0, 3).map((e) => JSON.stringify(e)).join("; "));

    const audienceMismatches = expected.filter((e) => cardAudience(e, parks) !== e.audience);
    check("card subtitles match R's card_audience()", audienceMismatches.length === 0,
          audienceMismatches.slice(0, 3).map((e) => `${cardAudience(e, parks)} != ${e.audience}`).join("; "));

    // Every mode/age/park can fill a card.
    const thin = expected.filter((e) => e.n < 24);
    check("every mode/age/park has at least 24 squares", thin.length === 0,
          thin.map((e) => `${e.mode}/${e.age}/${e.park}`).join(", "));

    // Card shape.
    const settings = { mode: "cynic", age: "adult", park: "animal_kingdom" };
    const card = makeCard(squares, settings, makeRng(1));
    const ids = card.grid.filter((id) => id !== null);
    check("card has 25 cells with a free center", card.grid.length === 25 && card.grid[12] === null);
    check("card has 24 distinct squares", ids.length === 24 && new Set(ids).size === 24);
    check("labels line up with ids",
          card.grid.every((id, i) => id === null ? card.labels[i] === null
            : squares.find((s) => s.id === id).text === card.labels[i]));
    check("only the free space starts crossed",
          card.crossed.filter(Boolean).length === 1 && card.crossed[12]);
    const pool = new Set(filterSquares(squares, settings).map((s) => s.id));
    check("all squares come from the filtered pool", ids.every((id) => pool.has(id)));

    // Seeded cards are reproducible and different seeds differ.
    const again = makeCard(squares, settings, makeRng(1));
    const other = makeCard(squares, settings, makeRng(2));
    check("same seed gives the same card", JSON.stringify(again.grid) === JSON.stringify(card.grid));
    check("different seeds give different cards", JSON.stringify(other.grid) !== JSON.stringify(card.grid));

    // No free space on even sizes.
    const four = makeCard(squares, { ...settings, size: 4 }, makeRng(3));
    check("4x4 card has no free space", four.grid.length === 16 && !four.grid.includes(null));

    // Balanced sampling spreads difficulty.
    const mixedPool = filterSquares(squares, { mode: "mixed", age: "adult", park: "any" })
      .map((s) => s.p_crossed).sort((a, b) => a - b);
    const q1 = mixedPool[Math.floor(mixedPool.length / 3)];
    const q2 = mixedPool[Math.floor((2 * mixedPool.length) / 3)];
    let spreadOk = true;
    for (let seed = 1; seed <= 20; seed++) {
      const c = makeCard(squares, { mode: "mixed", age: "adult", park: "any" }, makeRng(seed));
      const ps = c.grid.filter((id) => id).map((id) => squares.find((s) => s.id === id).p_crossed);
      if (ps.filter((p) => p <= q1).length < 6 || ps.filter((p) => p >= q2).length < 6) spreadOk = false;
    }
    check("balanced cards include easy and hard squares", spreadOk);

    // Difficulty tilts the mix, and every setting can deal every level.
    const meanP = (difficulty) => {
      let sum = 0;
      for (let seed = 1; seed <= 30; seed++) {
        const c = makeCard(squares, { mode: "fan", age: "child", park: "epcot", difficulty }, makeRng(seed));
        const ps = c.grid.filter((id) => id).map((id) => squares.find((s) => s.id === id).p_crossed);
        sum += ps.reduce((a, b) => a + b, 0) / ps.length;
      }
      return sum / 30;
    };
    const [pEasy, pAny, pHard] = ["easy", "any", "hard"].map(meanP);
    check("easy cards are easier and hard cards harder than normal", pEasy > pAny && pAny > pHard,
          `easy ${pEasy.toFixed(3)}, normal ${pAny.toFixed(3)}, hard ${pHard.toFixed(3)}`);
    let levelFailures = [];
    for (const e of expected) {
      for (const difficulty of ["easy", "medium", "hard"]) {
        try { makeCard(squares, { ...e, difficulty }, makeRng(1)); }
        catch { levelFailures.push(`${e.mode}/${e.age}/${e.park}/${difficulty}`); }
      }
    }
    check("every setting deals easy, medium, and hard cards", levelFailures.length === 0,
          levelFailures.slice(0, 5).join(", "));

    // Too few squares throws a helpful error.
    let threw = "";
    try { makeCard(squares, { mode: "fan", age: "child", park: "any", size: 9 }, makeRng(1)); }
    catch (err) { threw = err.message; }
    check("impossible settings throw", threw.startsWith("Only"), threw);

    // Bingo detection.
    check("5x5 has 12 winning lines", winningLines(5).length === 12);
    const crossed = Array(25).fill(false);
    check("empty card has no bingo", completedLines(crossed, 5).length === 0);
    [0, 6, 12, 18, 24].forEach((i) => { crossed[i] = true; });
    check("diagonal counts as a bingo", completedLines(crossed, 5).length === 1);
    [2, 7, 17, 22].forEach((i) => { crossed[i] = true; });
    check("two lines count as two bingos", completedLines(crossed, 5).length === 2);

    // Suggestions.
    const parkCodes = parks.map((p) => p.code);
    const good = buildSuggestion({ text: "  Stroller   with a license plate ", mode: "fan", age: "child", park: "epcot", note: "" });
    check("suggestions trim whitespace and get an id",
          good.text === "Stroller with a license plate" && good.submission_id.length >= 8 && good.type === "suggestion");
    check("valid suggestion passes", validateSuggestion(good, parkCodes) === null);
    check("too-short suggestion is rejected", validateSuggestion({ ...good, text: "ab" }, parkCodes) !== null);
    check("too-long suggestion is rejected", validateSuggestion({ ...good, text: "x".repeat(61) }, parkCodes) !== null);
    check("unknown park is rejected", validateSuggestion({ ...good, park: "universal" }, parkCodes) !== null);

    const reply = (body) => async () => ({ json: async () => body });
    const offline = async () => { throw new TypeError("Failed to fetch"); };
    const item = { payload: good, attempts: 0 };
    let calls = [];
    const spy = async (url, opts) => { calls.push({ url, opts }); return { json: async () => ({ ok: true }) }; };
    check("sent suggestions leave the outbox", (await flushOutbox([item, item], "https://x/exec", spy)).length === 0);
    check("sends JSON as text/plain (no CORS preflight)",
          calls.length === 2 && calls[0].opts.headers["Content-Type"].startsWith("text/plain") &&
          JSON.parse(calls[0].opts.body).submission_id === good.submission_id);
    const stillQueued = await flushOutbox([item], "https://x/exec", offline);
    check("offline suggestions stay queued", stillQueued.length === 1 && stillQueued[0].attempts === 1);
    check("busy inbox keeps suggestions queued",
          (await flushOutbox([item], "https://x/exec", reply({ ok: false, error: "busy", retry: true }))).length === 1);
    check("rejected suggestions are dropped",
          (await flushOutbox([item], "https://x/exec", reply({ ok: false, error: "invalid mode" }))).length === 0);
    check("suggestions give up after 20 failed attempts",
          (await flushOutbox([{ payload: good, attempts: 19 }], "https://x/exec", offline)).length === 0);

    check("inbox without results support keeps items queued",
          (await flushOutbox([item], "https://x/exec", reply({ ok: false, error: "unknown request type" }))).length === 1);

    // Usage counts.
    calls = [];
    sendCount("https://x/exec", "print", 4, spy, "example.github.io", "device-0001");
    check("usage counts send the event, number of cards, and device id",
          calls.length === 1 && JSON.stringify(JSON.parse(calls[0].opts.body)) ===
            JSON.stringify({ type: "visit", event: "print", n: 4, device: "device-0001" }));

    const memory = (items = {}) => ({
      getItem: (k) => items[k] ?? null, setItem: (k, v) => { items[k] = v; },
    });
    const store = memory();
    const firstId = deviceId(store);
    check("device id is created once and then reused",
          /^[A-Za-z0-9-]{8,64}$/.test(firstId) && deviceId(store) === firstId &&
          deviceId(memory()) !== firstId);
    check("a malformed stored device id is replaced",
          /^[A-Za-z0-9-]{8,64}$/.test(deviceId(memory({ "parkbingo.device": "bad id!" }))));
    const blocked = { getItem: () => { throw new Error("blocked"); } };
    check("no device id when storage is blocked", deviceId(blocked) === undefined);
    calls = [];
    sendCount("https://x/exec", "open", 1, spy, "localhost");
    sendCount("", "open", 1, spy, "example.github.io");
    check("usage isn't counted locally or without an inbox", calls.length === 0);

    // Card results.
    const played = makeCard(squares, { mode: "fan", age: "child", park: "epcot", difficulty: "hard" }, makeRng(11));
    [0, 1, 2, 3, 4, 7].forEach((i) => { played.crossed[i] = true; });
    const summary = summarizeCard(played);
    check("card summary counts spotted squares and bingos",
          summary.squares === 24 && summary.spotted === 6 && summary.bingos === 1);
    const result = buildResult(played, new Date("2026-09-14T18:00:00Z"));
    check("result has one entry per square, without the free space",
          result.squares.length === 24 && !result.squares.some((s) => s.id === null));
    check("result marks crossed squares",
          result.squares.filter((s) => s.crossed).length === 6 &&
          result.squares.find((s) => s.id === played.grid[7]).crossed === true &&
          result.squares.find((s) => s.id === played.grid[8]).crossed === false);
    check("result carries settings and times but nothing personal",
          result.type === "result" && result.card_id === played.cardId && result.difficulty === "hard" &&
          result.park === "epcot" && result.started_at === played.created &&
          result.ended_at === "2026-09-14T18:00:00.000Z" &&
          Object.keys(result).sort().join() ===
            "age,card_id,difficulty,ended_at,mode,park,size,squares,started_at,submission_id,type");
    const blank = makeCard(squares, { mode: "cynic", age: "adult", park: "any" }, makeRng(12));
    check("blank cards still produce a result",
          buildResult(blank).squares.every((s) => s.crossed === false) && summarizeCard(blank).spotted === 0);

    // Printable cards.
    const codes = parks.map((p) => p.code);
    const defaults = readPrintSettings(new URLSearchParams(""), codes);
    check("print page defaults to 4 child fan cards at any park",
          defaults.count === 4 && defaults.age === "child" && defaults.mode === "fan" &&
          defaults.park === "any" && defaults.difficulty === "any" && Number.isInteger(defaults.seed));
    const junk = readPrintSettings(new URLSearchParams("age=toddler&mode=grumpy&park=universal&difficulty=insane&n=99&seed=-4"), codes);
    check("bad print URL values fall back to defaults and clamp the count",
          junk.age === "child" && junk.mode === "fan" && junk.park === "any" &&
          junk.difficulty === "any" && junk.count === 12 && junk.seed >= 0);
    const printSettings = { age: "adult", mode: "cynic", park: "animal_kingdom", difficulty: "hard", count: 3, seed: 42 };
    const roundTrip = readPrintSettings(new URLSearchParams(printQuery(printSettings)), codes);
    check("print settings survive a round trip through the URL",
          Object.keys(printSettings).every((k) => roundTrip[k] === printSettings[k]));
    const setA = makePrintCards(squares, printSettings);
    const setB = makePrintCards(squares, printSettings);
    check("a print link reproduces the same cards",
          setA.length === 3 && JSON.stringify(setA.map((c) => c.grid)) === JSON.stringify(setB.map((c) => c.grid)));
    check("cards in a printed set differ", new Set(setA.map((c) => JSON.stringify(c.grid))).size === 3);
    const more = makePrintCards(squares, { ...printSettings, count: 5 });
    check("printing more cards keeps the first ones",
          JSON.stringify(more.slice(0, 3).map((c) => c.grid)) === JSON.stringify(setA.map((c) => c.grid)));

    // Report.
    const failed = results.filter((r) => !r.ok);
    document.getElementById("summary").textContent =
      `${results.length - failed.length} passed, ${failed.length} failed`;
    document.getElementById("summary").className = failed.length ? "fail" : "pass";
    document.getElementById("results").replaceChildren(...results.map((r) => {
      const li = document.createElement("li");
      li.className = r.ok ? "pass" : "fail";
      li.textContent = `${r.ok ? "PASS" : "FAIL"}: ${r.name}${r.detail ? ` (${r.detail})` : ""}`;
      return li;
    }));
    window.testResults = { passed: results.length - failed.length, failed };
  </script>
</body>
</html>
