<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Theme park bingo</title>
  <meta name="description" content="People-watching bingo for a day at the parks.">
  <meta name="theme-color" content="#FFFBF3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Park Bingo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="masthead">
      <h1 class="title">Theme park bingo</h1>
      <p class="subtitle" id="subtitle">&nbsp;</p>
    </header>

    <section id="setup-view" class="view" hidden>
      <form id="setup-form" class="setup">
        <fieldset class="field">
          <legend>Who's playing</legend>
          <div class="segmented">
            <label><input type="radio" name="age" value="adult" checked><span>Adult</span></label>
            <label><input type="radio" name="age" value="child"><span>Child</span></label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Mode</legend>
          <div class="segmented">
            <label><input type="radio" name="mode" value="fan" checked><span>Fan</span></label>
            <label><input type="radio" name="mode" value="cynic"><span>Cynic</span></label>
            <label><input type="radio" name="mode" value="mixed"><span>Both</span></label>
          </div>
        </fieldset>

        <div class="field">
          <label class="legend" for="park">Park</label>
          <select id="park" name="park"></select>
        </div>

        <fieldset class="field">
          <legend>Difficulty</legend>
          <div class="segmented">
            <label><input type="radio" name="difficulty" value="easy"><span>Easy</span></label>
            <label><input type="radio" name="difficulty" value="any" checked><span>Normal</span></label>
            <label><input type="radio" name="difficulty" value="hard"><span>Hard</span></label>
          </div>
        </fieldset>

        <p class="error" id="setup-error" role="alert" hidden></p>
        <button type="submit" class="primary" id="deal">Deal a card</button>
        <p class="hint" id="pool-hint"></p>
        <button type="button" class="link" id="back-to-card" hidden>Back to my card</button>
        <button type="button" class="link" id="print-cards">Print paper cards</button>
        <button type="button" class="link suggest-open" hidden>Suggest a square</button>
      </form>
    </section>

    <section id="card-view" class="view" hidden>
      <div class="banner off" id="banner" role="status" aria-live="polite">Bingo!</div>
      <div class="board" id="board" role="group" aria-label="Bingo card"></div>
      <div class="card-footer">
        <span id="progress"></span>
        <span class="card-id" id="card-id"></span>
      </div>
      <button type="button" class="primary card-action" id="done-playing">Done playing</button>
      <button type="button" class="secondary" id="new-card">New card</button>
      <button type="button" class="link suggest-open" hidden>Suggest a square</button>
    </section>

    <section id="done-view" class="view" hidden>
      <div class="setup">
        <div class="summary">
          <p class="summary-big" id="done-spotted"></p>
          <p class="summary-small" id="done-bingos"></p>
        </div>

        <label class="share" id="share-row" hidden>
          <input type="checkbox" id="share-results">
          <span>
            <strong>Share this card's results</strong>
            <span class="share-detail">Sends which squares you crossed off, the card
              settings, and when you started and finished, so squares get fairer
              difficulty ratings. Nothing about you or your phone is sent.</span>
          </span>
        </label>

        <button type="button" class="primary" id="finish-card">Finish card</button>
        <button type="button" class="link" id="keep-playing">Keep playing</button>
      </div>
    </section>

    <section id="suggest-view" class="view" hidden>
      <form id="suggest-form" class="setup" novalidate>
        <p class="intro">Spotted something that belongs on a card? Suggestions are
          reviewed before they're added.</p>

        <div class="field">
          <label class="legend" for="suggest-text">Square</label>
          <input id="suggest-text" name="text" type="text" maxlength="60"
                 autocomplete="off" enterkeyhint="done"
                 placeholder="e.g. Stroller with a license plate">
          <p class="counter" id="suggest-count">0 / 60</p>
        </div>

        <fieldset class="field">
          <legend>Mode</legend>
          <div class="segmented">
            <label><input type="radio" name="mode" value="fan"><span>Fan</span></label>
            <label><input type="radio" name="mode" value="cynic"><span>Cynic</span></label>
            <label><input type="radio" name="mode" value="any" checked><span>Both</span></label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend>Suitable for</legend>
          <div class="segmented">
            <label><input type="radio" name="age" value="child" checked><span>Everyone</span></label>
            <label><input type="radio" name="age" value="adult"><span>Adults only</span></label>
          </div>
        </fieldset>

        <div class="field">
          <label class="legend" for="suggest-park">Where you'd see it</label>
          <select id="suggest-park" name="park"></select>
        </div>

        <div class="field">
          <label class="legend" for="suggest-note">Note (optional)</label>
          <textarea id="suggest-note" name="note" rows="2" maxlength="200"
                    placeholder="Anything that helps, like how often you see it"></textarea>
        </div>

        <!-- Hidden from people; bots that fill it in get ignored. -->
        <div class="trap" aria-hidden="true">
          <label for="suggest-website">Website</label>
          <input id="suggest-website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <p class="error" id="suggest-error" role="alert" hidden></p>
        <button type="submit" class="primary">Send suggestion</button>
        <button type="button" class="link" id="suggest-cancel">Cancel</button>
      </form>
    </section>

    <p class="loading" id="loading">Loading squares...</p>
    <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
